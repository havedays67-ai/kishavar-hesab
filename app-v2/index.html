<html lang="fa" dir="rtl">

    <!--
      قفل مقیاس دیداری: در WebView اندروید و مرورگر موبایل، فوکوس روی فیلدها،
      بازشدن دوربین/انتخاب فایل و تغییر ارتفاع صفحه نباید کل برنامه را زوم کند.
      interactive-widget=resizes-content فقط ناحیهٔ دید را با کیبورد تنظیم می‌کند.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#08130f" />
    <meta
      name="description"
      content="کشاورزحساب — حسابداری، معامله محصول، قرارداد و اجاره زمین، اسناد چاپی A4، امضا و دستیار هوشمند کشاورزیار"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>کشاورزحساب | کشاورزیار — حسابداری، سند و معامله کشاورزی</title>
  </head>

name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug یا release"
        required: true
        default: "debug"
        type: choice
        options: ["debug", "release"]
      server_url:
        description: "آدرس نسخه وب (مثلاً https://agri.example.com)"
        required: false
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**/*.md"
      - "site/**"

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regression tests (accounting, counterparty, Jalali dates)
        run: npx vitest run tests/offline-engine.test.ts tests/lease.test.ts tests/lease-forms.test.ts tests/document-validity.test.ts

      - name: Build advanced field app (APK payload)
        run: |
          cd app-v2
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html
          cp dist/index.html ../capacitor-web/index.html
          rm -f ../capacitor-web/app.js
          cd ..
          echo "APK payload built from app-v2/dist/index.html"
          ls -lh capacitor-web/index.html
          for term in "معامله محصول" "بدهکار و بستانکار" "اجاره و اقساط" "دانلود PDF" "دفتر مالی" "اعتبار اسناد" "رسید و فیش" "افزودن تصویر رسید" "رسیدهای این رکورد" "مشاهده"; do grep -q "$term" capacitor-web/index.html && echo "found: $term" || (echo "missing required term: $term" && exit 1); done
          if grep -q "no-print fixed bottom-\[76px\] left-3" capacitor-web/index.html; then echo "floating receipt button is back"; exit 1; fi
          echo "per-record receipt UI verified"

      - name: Android SDK packages (preinstalled runner SDK)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "using SDK at $SDK"
          ls "$SDK" || true
          SDKM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Capacitor toolchain
        run: npm install --no-audit --no-fund

      - name: Add Android platform (bundled app, no remote URL)
        run: |
          unset CAPACITOR_SERVER_URL
          npx cap add android
          npx cap sync android
          echo "Android 8+ (minSdk 26) enforced"
          echo "--- registered capacitor plugins ---"
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -qi "Filesystem" android/app/src/main/assets/capacitor.plugins.json || (echo "Filesystem plugin missing" && exit 1)
          grep -qi "Share" android/app/src/main/assets/capacitor.plugins.json || (echo "Share plugin missing" && exit 1)
          grep -qi "LocalNotifications" android/app/src/main/assets/capacitor.plugins.json || (echo "LocalNotifications plugin missing" && exit 1)
          
      - name: Configure project (minSdk 26, target 35)
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          sed -i -E 's/targetSdkVersion = [0-9]+/targetSdkVersion = 35/' android/variables.gradle
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 35/' android/variables.gradle
          grep -n "minSdkVersion\|targetSdkVersion\|compileSdkVersion" android/variables.gradle
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' android/app/src/main/AndroidManifest.xml
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" android/app/build.gradle
          echo "versionCode=$CODE"
          sed -i -E 's/versionName "[^"]*"/versionName "1.0.0"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Decode release keystore (optional)
        if: ${{ github.event.inputs.variant == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "keystore ready"
          else
            echo "No KEYSTORE_BASE64 secret found — release will be signed with debug key."
          fi

      - name: Install stable signing key (same key for every build)
        run: |
          mkdir -p "$HOME/.android"
          cp signing/debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E "Alias|SHA256|Valid" | head -5
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  kishavarStable {
                      storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.kishavarStable }
                  release { signingConfig signingConfigs.kishavarStable }
              }
          }
          GRADLE

      - name: Build APK
        env:
          VARIANT: ${{ github.event.inputs.variant || 'debug' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "$VARIANT" = "release" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS") ?: "kishavar"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE
            ./gradlew assembleRelease --no-daemon
            OUT=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          else
            ./gradlew assembleDebug --no-daemon
            OUT=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          cp "$OUT" ../KishavarHesab-1.0.0.apk
          ls -lh ../KishavarHesab-1.0.0.apk

      - name: Verify APK is signed with the stable key (updates install over old version)
        env:
          VARIANT: ${{ github.event.inputs.variant || 'debug' }}
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then APKSIGNER=$(command -v apksigner || true); fi
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          "$APKSIGNER" verify --print-certs KishavarHesab-1.0.0.apk | tee apk-cert.txt
          ACTUAL=$(grep -iE "certificate SHA-256 digest" apk-cert.txt | head -1 | grep -oiE "[0-9a-f]{64}" | head -1 | tr 'A-F' 'a-f')
          EXPECTED=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | grep -iE "SHA256:" | grep -oiE "([0-9a-f]{2}:){31}[0-9a-f]{2}" | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "expected-key-sha256=$EXPECTED"
          echo "apk-cert-sha256=$ACTUAL"
          if [ -z "$ACTUAL" ]; then echo "APK signature could not be verified"; exit 1; fi
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$ACTUAL" ]; then echo "APK signature key changed — updates would break"; exit 1; fi
          VCODE=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | head -1 | awk '{print $2}')
          printf 'variant=%s\nversionCode=%s\napk-cert-sha256=%s\n' "$VARIANT" "$VCODE" "$ACTUAL" > apk-build-info.txt
          cat apk-build-info.txt

      - name: Fast-layer quality gates before publishing
        run: |
          cd app-v2
          npx tsc --noEmit --pretty false
          cd ..
          npx vitest run tests/fast-layer.test.ts
          node -e '
            const r = require("./eval_report.json");
            if (r.fastLayerClassification.intentAccuracy < 90) process.exit(1);
            if (r.jsonContract.rejectedCorruptedJson !== r.jsonContract.sampleSize) process.exit(1);
          '

      - name: Prepare dev APK (auto pre-release on every main push)
        run: |
          cp KishavarHesab-1.0.0.apk KishavarHesab-dev.apk
          ls -lh KishavarHesab-dev.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kishavarhesab-apk
          path: KishavarHesab-1.0.0.apk
          retention-days: 30

      - name: Prepare release notes (Jalali date, SHA-256, single download URL)
        run: |
          SHA=$(sha256sum KishavarHesab-1.0.0.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s KishavarHesab-1.0.0.apk)
          SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $SIZE/1048576}")
          echo "$SHA" > /tmp/apk-sha.txt
          echo "$SIZE" > /tmp/apk-size.txt
          echo "$SIZE_MB" > /tmp/apk-size-mb.txt
          SHA="$SHA" SIZE="$SIZE" SIZE_MB="$SIZE_MB" node - <<'NODE' > release-notes.md
          const jalaliParts = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Tehran',
          }).formatToParts(new Date());
          const get = (type) => jalaliParts.find((part) => part.type === type)?.value ?? '';
          console.log('نسخه اندروید کشاورزحساب / کسب‌وکار من — 1.0.0');
          console.log('');
          console.log('آخرین بازسازی: ' + [get('weekday'), get('day'), get('month'), get('year')].join(' ') + ' — به وقت ایران');
          console.log('');
          console.log('این بسته از اپ میدانی پیشرفته در پوشه app-v2 ساخته شده است.');
          console.log('');
          console.log('تازه‌ها:');
          console.log('- حذف دکمهٔ شناور «آپلود رسید»: رسید درست زیر همان رکورد ذخیره می‌شود');
          console.log('- هر رکورد چند رسید می‌گیرد: بدهی، چک، وام، طرف‌حساب، معامله، قرارداد، زمین/کشت و انبار');
          console.log('- برای هر رسید: مشاهده در پنجرهٔ داخلی، دانلود واقعی با نام و پسوند درست، و حذف');
          console.log('- کشاورزیار با دانش تأییدشدهٔ ۳.۲.۰: آب و آبیاری، کود، آفت، شوری، دام، بیمه و بهای تمام‌شده');
          console.log('- رفع خطای مسیردهی دستیار: پرسش کشاورزی دیگر با پاسخ «معامله‌ای ثبت نشده» جواب داده نمی‌شود');
          console.log('- تحلیل اعتبار حقوقی ۱۷ سند با نشان سطح ۱ تا ۴ و منابع قانونی');
          console.log('- ماشین‌حساب فروش محصول: وزن باسکول، افت رطوبت، افت مفید/غیرمفید، درجه کیفی، نرخ، هزینه و مالیات');
          console.log('- قرارداد زمین با انتخاب دوطرفه طرف قرارداد و تاریخ شمسی');
          console.log('- مرکز اسناد: قرارداد فروش، قبض باسکول، صورتجلسه کیفیت، صورت‌حساب و تسویه');
          console.log('- زمین و کشت با بهای تمام‌شده هر کیلو و نقطه سربه‌سر');
          console.log('- گزارش‌های مدیریتی و تحلیل هوشمند با بیش از ۲۵ قاعده');
          console.log('- چاپ A4 با سریال، QR، مبلغ به حروف و جای مهر و امضا');
          console.log('- دانلود واقعی PDF داخل برنامه (بدون نیاز به مرورگر)');
          console.log('- ویرایش و حذف طرف‌حساب، سند مالی، زمین، معامله و قرارداد');
          console.log('- حذف صفحه دریافت برنامه از داخل اپ اندروید');
          console.log('- امضای ثابت APK با کلید واحد (قابل به‌روزرسانی بدون حذف نسخه قبل)');
          console.log('- امضای دستی + امضای رمزنگاری ECDSA روی دستگاه');
          console.log('- حذف اثر انگشت و بیومتریک از برنامه');
          console.log('');
          console.log('SHA-256: ' + process.env.SHA);
          console.log('حجم فایل: ' + process.env.SIZE_MB + ' مگابایت (' + process.env.SIZE + ' بایت)');
          console.log('');
          console.log('دانلود رسمی: https://github.com/havedays67-ai/kishavar-hesab/releases/latest/download/KishavarHesab-1.0.0.apk');
          console.log('');
          console.log('این نسخه با کلید ثابت آزمایشی امضا می‌شود؛ نسخه قبلی را می‌توانید مستقیماً به‌روزرسانی کنید. اگر نصب نشد، نسخه قبلی را حذف و دوباره نصب کنید (داده‌ها را قبلاً پشتیبان بگیرید).');
          console.log('');
          console.log('نصب تازه کاملاً خالی است؛ داده‌های نمونه فقط در حالت آزمایش و به‌صورت دستی بارگذاری می‌شوند.');
          NODE

      - name: Publish dev pre-release (dev-latest)
        if: ${{ github.event_name == 'push' || github.event.inputs.variant == 'debug' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: کشاورزحساب — نسخه توسعه (آفلاین، dev)
          prerelease: true
          make_latest: false
          body: |
            **نسخه توسعه، ساخت خودکار از شاخه main — برای آزمایش.**
            نسخه رسمی همچنان `1.0.0` است و تگ پایدار `apk-v1` منتشر می‌شود.
            versionCode از شماره اجرای GitHub Actions ساخته می‌شود و APK با کلید ثابت مخزن امضا می‌شود.
          files: KishavarHesab-dev.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1
          name: کشاورزحساب ۱.۰ (اندروید ۸+)
          make_latest: true
          overwrite_files: true
          body_path: release-notes.md
          files: KishavarHesab-1.0.0.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

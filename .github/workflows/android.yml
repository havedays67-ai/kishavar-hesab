name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug یا release"
        required: true
        default: "debug"
        type: choice
        options: ["debug", "release"]
      server_url:
        description: "آدرس نسخه وب (مثلاً https://agri.example.com)"
        required: false
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**/*.md"

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regression tests (accounting, counterparty, Jalali dates)
        run: npx vitest run tests/offline-engine.test.ts tests/lease.test.ts tests/lease-forms.test.ts

      - name: Build advanced field app (APK payload)
        run: |
          cd app-v2
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html
          cp dist/index.html ../capacitor-web/index.html
          rm -f ../capacitor-web/app.js
          cd ..
          echo "APK payload built from app-v2/dist/index.html"
          ls -lh capacitor-web/index.html
          for term in "معامله محصول" "بدهکار و بستانکار" "اجاره و اقساط" "دانلود PDF" "دفتر مالی"; do grep -q "$term" capacitor-web/index.html && echo "found: $term"; done

      - name: Android SDK packages (preinstalled runner SDK)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "using SDK at $SDK"
          ls "$SDK" || true
          SDKM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Capacitor toolchain
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Add Android platform (bundled app, no remote URL)
        run: |
          unset CAPACITOR_SERVER_URL
          npx cap add android
          echo "Android 8+ (minSdk 26) enforced"

      - name: Configure project (minSdk 26, target 35)
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          sed -i -E 's/targetSdkVersion = [0-9]+/targetSdkVersion = 35/' android/variables.gradle
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 35/' android/variables.gradle
          grep -n "minSdkVersion\|targetSdkVersion\|compileSdkVersion" android/variables.gradle
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/versionCode [0-9]+/versionCode 3/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.0.0"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Decode release keystore (optional)
        if: ${{ github.event.inputs.variant == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "keystore ready"
          else
            echo "No KEYSTORE_BASE64 secret found — release will be signed with debug key."
          fi

      - name: Build APK
        env:
          VARIANT: ${{ github.event.inputs.variant || 'debug' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "$VARIANT" = "release" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS") ?: "kishavar"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE
            ./gradlew assembleRelease --no-daemon
            OUT=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          else
            ./gradlew assembleDebug --no-daemon
            OUT=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          cp "$OUT" ../KishavarHesab-1.0.0.apk
          ls -lh ../KishavarHesab-1.0.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kishavarhesab-apk
          path: KishavarHesab-1.0.0.apk
          retention-days: 30

      - name: Prepare release notes (Jalali date, SHA-256, single download URL)
        run: |
          SHA=$(sha256sum KishavarHesab-1.0.0.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s KishavarHesab-1.0.0.apk)
          SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $SIZE/1048576}")
          echo "$SHA" > /tmp/apk-sha.txt
          echo "$SIZE" > /tmp/apk-size.txt
          echo "$SIZE_MB" > /tmp/apk-size-mb.txt
          SHA="$SHA" SIZE="$SIZE" SIZE_MB="$SIZE_MB" node - <<'NODE' > release-notes.md
          const jalaliParts = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Tehran',
          }).formatToParts(new Date());
          const get = (type) => jalaliParts.find((part) => part.type === type)?.value ?? '';
          console.log('نسخه اندروید کشاورزحساب / کسب‌وکار من — 1.0.0');
          console.log('');
          console.log('آخرین بازسازی: ' + [get('weekday'), get('day'), get('month'), get('year')].join(' ') + ' — به وقت ایران');
          console.log('');
          console.log('این بسته از اپ میدانی پیشرفته در پوشه app-v2 ساخته شده است.');
          console.log('');
          console.log('تازه‌ها:');
          console.log('- ماشین‌حساب فروش محصول: وزن باسکول، افت رطوبت، افت مفید/غیرمفید، درجه کیفی، نرخ، هزینه و مالیات');
          console.log('- قرارداد زمین با انتخاب دوطرفه طرف قرارداد و تاریخ شمسی');
          console.log('- مرکز اسناد: قرارداد فروش، قبض باسکول، صورتجلسه کیفیت، صورت‌حساب و تسویه');
          console.log('- زمین و کشت با بهای تمام‌شده هر کیلو و نقطه سربه‌سر');
          console.log('- گزارش‌های مدیریتی و صفحه معماری و آزمون موتور');
          console.log('- چاپ A4 با سریال، QR، مبلغ به حروف و جای مهر و امضا');
          console.log('');
          console.log('SHA-256: ' + process.env.SHA);
          console.log('حجم فایل: ' + process.env.SIZE_MB + ' مگابایت (' + process.env.SIZE + ' بایت)');
          console.log('');
          console.log('دانلود رسمی: https://github.com/havedays67-ai/kishavar-hesab/releases/latest/download/KishavarHesab-1.0.0.apk');
          console.log('');
          console.log('نصب: اگر نسخه قبلی نصب است و پیام «برنامه نصب نشد» دیدید، نسخه قدیمی را حذف و سپس نصب کنید (کلید امضای نسخه آزمایشی در هر ساخت متفاوت است).');
          NODE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1
          name: کشاورزحساب ۱.۰ (اندروید ۸+)
          make_latest: true
          overwrite_files: true
          body_path: release-notes.md
          files: KishavarHesab-1.0.0.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

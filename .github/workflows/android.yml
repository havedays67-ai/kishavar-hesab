name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug یا release"
        required: true
        default: "debug"
        type: choice
        options: ["debug", "release"]
      server_url:
        description: "آدرس نسخه وب (مثلاً https://agri.example.com)"
        required: false
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build offline web app
        run: npm run build:offline

      - name: Android SDK packages (preinstalled runner SDK)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "using SDK at $SDK"
          ls "$SDK" || true
          SDKM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Capacitor toolchain
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Add Android platform
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || vars.APP_SERVER_URL }}
        run: |
          npx cap add android
          echo "Android 8+ (minSdk 26) enforced"

      - name: Configure project (minSdk 26, target 35)
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          sed -i -E 's/targetSdkVersion = [0-9]+/targetSdkVersion = 35/' android/variables.gradle
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 35/' android/variables.gradle
          grep -n "minSdkVersion\|targetSdkVersion\|compileSdkVersion" android/variables.gradle
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/versionCode [0-9]+/versionCode 1/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.0"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Decode release keystore (optional)
        if: ${{ github.event.inputs.variant == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "keystore ready"
          else
            echo "No KEYSTORE_BASE64 secret found — release will be signed with debug key."
          fi

      - name: Build APK
        env:
          VARIANT: ${{ github.event.inputs.variant || 'debug' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "$VARIANT" = "release" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS") ?: "kishavar"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE
            ./gradlew assembleRelease --no-daemon
            OUT=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          else
            ./gradlew assembleDebug --no-daemon
            OUT=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          cp "$OUT" ../KishavarHesab-1.0.0.apk
          ls -lh ../KishavarHesab-1.0.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kishavarhesab-apk
          path: KishavarHesab-1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1
          name: کشاورزحساب ۱.۰ (اندروید ۸+)
          make_latest: true
          overwrite_files: true
          body: |
            نسخه اندروید کشاورزحساب ۱.۰ (شماره نسخه ثابت ۱ — نسخه رسمی منتشرنشده).
            این Release با هر push روی main به‌روزرسانی می‌شود؛ لینک دانلود همیشه ثابت است:
            https://github.com/havedays67-ai/kishavar-hesab/releases/latest/download/KishavarHesab-1.0.0.apk

            حداقل اندروید ۸ (API 26). ویرایش/حذف همهٔ بخش‌ها و نمایش مبالغ به ریال + حروفی تومان.

            نصب: فایل APK را دانلود کنید، «نصب از منابع ناشناس» را برای فایل‌منیجر فعال کنید و نصب کنید.
            در اولین اجرا آدرس سرور نسخه وب را وارد کنید.

            امضای این نسخه: debug اندروید (alias: androiddebugkey / storePassword: android / keyPassword: android).
            برای نسخه امضاشده اختصاصی، Secrets مربوط به KEYSTORE_* را تنظیم کنید.
          files: KishavarHesab-1.0.0.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

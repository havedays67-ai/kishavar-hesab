name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug یا release"
        required: true
        default: "debug"
        type: choice
        options: ["debug", "release"]
      server_url:
        description: "آدرس نسخه وب (مثلاً https://agri.example.com)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capacitor toolchain
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || vars.APP_SERVER_URL }}
        run: |
          npx cap add android
          echo "Android 8+ (minSdk 26) enforced"

      - name: Configure project (minSdk 26, target 35, app label)
        run: |
          python3 - <<'PY'
          import re, pathlib
          gradle = pathlib.Path("android/variables.gradle")
          text = gradle.read_text()
          text = re.sub(r"minSdkVersion = \d+", "minSdkVersion = 26", text)
          text = re.sub(r"targetSdkVersion = \d+", "targetSdkVersion = 35", text)
          text = re.sub(r"compileSdkVersion = \d+", "compileSdkVersion = 35", text)
          gradle.write_text(text)

          strings = pathlib.Path("android/app/src/main/res/values/strings.xml")
          if strings.exists():
              body = strings.read_text()
              body = re.sub(r"<string name=\"app_name\">.*?</string>", "<string name=\"app_name\">کشاورزحساب</string>", body)
              body = re.sub(r"<string name=\"title_activity_main\">.*?</string>", "<string name=\"title_activity_main\">کشاورزحساب</string>", body)
              strings.write_text(body)

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          body = manifest.read_text()
          if "android.permission.INTERNET" not in body:
              body = body.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application')
          manifest.write_text(body)
          print("project configured")
          PY

      - name: Decode release keystore (optional)
        if: ${{ github.event.inputs.variant == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "keystore ready"
          else
            echo "No KEYSTORE_BASE64 secret found — release will be signed with debug key."
          fi

      - name: Build APK
        env:
          VARIANT: ${{ github.event.inputs.variant || 'debug' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "$VARIANT" = "release" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS") ?: "kishavar"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE
            ./gradlew assembleRelease --no-daemon
            OUT=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          else
            ./gradlew assembleDebug --no-daemon
            OUT=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          cp "$OUT" ../KishavarHesab-1.0.0.apk
          ls -lh ../KishavarHesab-1.0.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kishavarhesab-apk
          path: KishavarHesab-1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: کشاورزحساب ۱.۰ (اندروید ۸+)
          body: |
            نسخه اندروید کشاورزحساب — حداقل اندروید ۸ (API 26).

            نصب: فایل APK را دانلود کنید، «نصب از منابع ناشناس» را برای فایل‌منیجر فعال کنید و نصب کنید.
            در اولین اجرا آدرس سرور نسخه وب را وارد کنید.

            امضای این نسخه: debug اندروید (alias: androiddebugkey / storePassword: android / keyPassword: android).
            برای نسخه امضاشده اختصاصی، Secrets مربوط به KEYSTORE_* را تنظیم کنید.
          files: KishavarHesab-1.0.0.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Engine unit tests (deterministic accounting + JSON contract)
        run: npx vitest run

      - name: Regenerate dataset (determinism check)
        run: npx tsx scripts/gen-dataset.ts

      - name: Dataset must match generator
        run: git diff --exit-code -- training/data

      - name: Dataset quality gate (balance, coverage, leakage, safety)
        run: npx tsx scripts/check-dataset.ts

      - name: Dataset validation (zero contract errors gate)
        run: npx tsx scripts/validate-dataset.ts training/data/*.jsonl

      - name: Train CPU brain + Persian lexicon (deterministic, CPU only)
        run: npx tsx tools/train/train-brain.ts

      - name: Brain artifacts must match training (no manual drift)
        run: git diff --exit-code -- app-v2/src/lib/nlu/generated training/report.json

      - name: Brain quality gate (real hold-out + hard-eval numbers)
        run: |
          node -e '
            const r = require("./training/report.json");
            if (!(r.model.weightBytes > 80000)) { console.error("brain weights missing"); process.exit(1); }
            if (!(r.model.accuracyOnHoldoutPercent >= 90)) { console.error("brain hold-out accuracy below 90: " + r.model.accuracyOnHoldoutPercent); process.exit(1); }
            if (!(r.hardEval && r.hardEval.total >= 200)) { console.error("brain hard-eval missing"); process.exit(1); }
            if (!(r.persian.vocabulary >= 200)) { console.error("persian vocabulary too small"); process.exit(1); }
            if (!(r.math && r.math.solvedByEnginePercent >= 95)) { console.error("math training coverage below 95%"); process.exit(1); }
            console.log("brain gate ok", "holdout", r.model.accuracyOnHoldoutPercent, "hardEval", r.hardEval.accuracy, "vocab", r.persian.vocabulary);
          '

      - name: Fast understanding layer tests (normalizer, rules, pack, brain, simulator, cache, router)
        run: npx vitest run tests/fast-layer.test.ts

      - name: Corpus + hard-eval determinism
        run: |
          npx tsx tools/build_pack/generate.ts
          npx tsx tools/build_pack/build-pack.ts
          npx tsx tools/build_pack/eval.ts
          git diff --exit-code -- training/data tools/build_pack/data app-v2/src/lib/nlu/generated

      - name: Index + bloom benchmark (real numbers, not a gate)
        run: |
          npx tsx tools/build_pack/bench-index.ts
          node -e '
            const b = require("./artifacts/index-bench.json");
            if (b.variants.length < 4) { console.error("bench variants missing"); process.exit(1); }
            if (!(b.pack.bloomBytes > 0)) { console.error("pack has no bloom"); process.exit(1); }
            if (!(b.pack.measuredFalsePositiveRate < 0.05)) { console.error("bloom false-positive rate too high"); process.exit(1); }
            console.log("bench ok", b.variants.map((v) => v.label + " miss=" + v.miss.meanUs + "us").join(" | "));
          '

      - name: Fast layer quality gate (JSON contract + measured accuracy)
        run: |
          node -e '
            const r = require("./eval_report.json");
            const json = r.jsonContract;
            if (json.acceptedValidJson !== json.sampleSize) { console.error("valid JSON rejected"); process.exit(1); }
            if (json.rejectedCorruptedJson !== json.sampleSize) { console.error("corrupted JSON accepted"); process.exit(1); }
            if (r.fastLayerClassification.intentAccuracy < 90) { console.error("intent accuracy below gate: " + r.fastLayerClassification.intentAccuracy); process.exit(1); }
            if (r.metrics.modelCalls !== 0) { console.error("unexpected model calls"); process.exit(1); }
            if (!r.bloom || !r.bloom.enabled) { console.error("bloom prefilter missing"); process.exit(1); }
            if (!(r.bloom.measuredFalsePositiveRate < 0.02)) { console.error("bloom false-positive rate above 2%: " + r.bloom.measuredFalsePositiveRate); process.exit(1); }
            if (r.bloom.storesTextOrMoney !== false) { console.error("bloom must not store text or money"); process.exit(1); }
            if (!r.cpuBrain || r.cpuBrain.available !== true) { console.error("cpu brain not available"); process.exit(1); }
            if (!r.math) { console.error("math benchmark missing"); process.exit(1); }
            if (r.math.exactMatches !== r.math.referenceCases) { console.error("math reference mismatch: " + JSON.stringify(r.math.mismatches)); process.exit(1); }
            if (r.math.safetyGuardsPassed !== r.math.safetyGuardsTotal) { console.error("math safety guard failed"); process.exit(1); }
            if (!r.simulator || !(r.simulator.samples > 0)) { console.error("processor simulator missing"); process.exit(1); }
            console.log("fast layer gate ok", r.fastLayerClassification.intentAccuracy, "slotExact", r.fastLayerClassification.slotExactMatch, "p95", r.metrics.p95Ms + "ms", "bloomFpr", r.bloom.measuredFalsePositiveRate);
          '

      - name: app-v2 typecheck (APK payload)
        working-directory: app-v2
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit --pretty false

      - name: app-v2 production build (APK payload)
        working-directory: app-v2
        run: npm run build

      - name: Type generation
        run: npx next typegen

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Apply database schema
        run: npx drizzle-kit push --force

      - name: Production build
        run: npm run build

      - name: Upload dataset stats and benchmark
        uses: actions/upload-artifact@v4
        with:
          name: dataset-stats
          path: |
            training/data/stats.json
            artifacts/index-bench.json
            eval_report.json
            training/report.json
          if-no-files-found: warn

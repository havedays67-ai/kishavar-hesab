<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#12563c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>کشاورزحساب — حسابداری آفلاین</title>
<style>
:root{
  --canvas:#f5f3ec; --surface:#fdfcf8; --surface-2:#f8f6ef; --surface-3:#f1eee4;
  --ink:#14251c; --ink-2:#34493d; --muted:#6d7c72; --line:#e2ded1; --line-2:#cfc9b8;
  --brand:#12563c; --brand-deep:#0a3a27; --brand-soft:#e3eee6; --on-brand:#ffffff;
  --accent:#b8913f; --accent-soft:#f4ebd7;
  --pos:#14784f; --pos-soft:#e2f1e8; --neg:#b0422b; --neg-soft:#f8e4df;
  --warn:#a1711a; --warn-soft:#f8eed8; --info:#2a6683; --info-soft:#e2eef3;
  --shadow:0 18px 40px -30px rgba(14,42,30,.45);
}
[data-theme="dark"]{
  --canvas:#0a1511; --surface:#10201a; --surface-2:#14261f; --surface-3:#1a2f26;
  --ink:#eaf2ec; --ink-2:#c6d6cc; --muted:#93a89c; --line:#244036; --line-2:#315245;
  --brand:#54b98a; --brand-deep:#2f8f66; --brand-soft:#16362a; --on-brand:#06231a;
  --accent:#d8b872; --accent-soft:#332a19;
  --pos:#5cc796; --pos-soft:#123328; --neg:#f08e77; --neg-soft:#3a1f1a;
  --warn:#e6bd66; --warn-soft:#362a13; --info:#82c2de; --info-soft:#12303c;
  --shadow:0 18px 40px -28px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(760px 340px at 88% -10%,var(--brand-soft),transparent 62%),
    radial-gradient(620px 300px at 0% 0%,var(--accent-soft),transparent 58%),var(--canvas);
  color:var(--ink);font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:14px;line-height:1.7;
}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:86px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));
  display:grid;place-items:center;color:#f4ebd7;font-size:19px;flex:0 0 auto}
h1{font-size:14.5px;margin:0;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{display:flex;align-items:center;gap:6px}
.pill{font-size:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
  border-radius:999px;padding:4px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--pos)}
.icon-btn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);font-size:15px;display:grid;place-items:center;cursor:pointer}
main{flex:1;padding:12px 14px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;
  box-shadow:var(--shadow);margin:0 0 10px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-size:10px;color:var(--muted);font-weight:400}
.hero{background:linear-gradient(160deg,var(--brand-deep),var(--brand) 55%,#1c6b4c);color:#fff;border:none;
  border-radius:22px;padding:16px;margin-bottom:12px}
.hero .h-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;opacity:.85}
.hero .big{font-size:23px;font-weight:800;margin:6px 0 2px;letter-spacing:-.2px}
.hero .hint{font-size:11px;opacity:.82}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.hero-grid div{background:rgba(255,255,255,.13);border-radius:12px;padding:7px 9px}
.hero-grid span{display:block;font-size:9.5px;opacity:.82}
.hero-grid b{font-size:12.5px;font-weight:800;display:block;margin-top:1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:10px 11px;box-shadow:var(--shadow)}
.stat .k{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px}
.stat .v{font-size:15px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .d{font-size:9.5px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700;
  background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)}
.chip.neg{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;
  background:var(--surface-3);flex:0 0 auto}
.row .ico.in{background:var(--pos-soft)} .row .ico.out{background:var(--neg-soft)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:9.8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.bar-wrap{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bar{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--brand);min-height:3px;animation:grow .5s ease-out both}
.bar.exp{background:var(--accent)}
.bar-lbl{font-size:9px;color:var(--muted)}
@keyframes grow{from{transform:scaleY(.05);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .28s ease-out both}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:9.5px;padding:6px;text-align:right;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);font:inherit;font-size:11.5px;font-weight:700;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--neg-soft);border-color:var(--neg-soft);color:var(--neg)}
.btn.sm{padding:5px 9px;font-size:10.5px;border-radius:10px}
.btn:active{transform:translateY(1px)}
.btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin:0 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line-2);border-radius:11px;background:var(--surface-2);
  color:var(--ink);font:inherit;font-size:12.5px;padding:9px 10px;margin:0 0 9px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type=date]{direction:ltr}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.empty{text-align:center;padding:22px 12px;color:var(--muted);font-size:11.5px;border:1px dashed var(--line-2);
  border-radius:14px;background:var(--surface-2)}
.fab{position:fixed;bottom:76px;left:14px;z-index:30;width:54px;height:54px;border-radius:17px;border:0;
  background:var(--brand);color:var(--on-brand);font-size:24px;box-shadow:0 16px 30px -16px rgba(10,58,39,.9);cursor:pointer}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;
  background:var(--surface);border-top:1px solid var(--line);
  padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
#nav button{flex:1;max-width:110px;background:none;border:0;color:var(--muted);font:inherit;font-size:9.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:12px;cursor:pointer}
#nav button .i{font-size:17px;line-height:1}
#nav button.on{color:var(--brand);background:var(--brand-soft)}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,20,15,.42)}
.sheet-wrap.hide{display:none}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out both}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sheet-head h3{font-size:13.5px;margin:0}
.close{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;width:30px;height:30px;cursor:pointer}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px}
.tabs button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:999px;
  padding:5px 10px;font:inherit;font-size:10.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.toast{position:fixed;bottom:96px;right:14px;left:14px;max-width:520px;margin:0 auto;z-index:80;background:#0f2a1e;
  color:#eaf5ee;border-radius:14px;padding:10px 13px;font-size:11.5px;box-shadow:0 18px 34px -18px rgba(0,0,0,.7);
  opacity:0;pointer-events:none;transform:translateY(12px);transition:.22s}
.toast.show{opacity:1;transform:none}
.toast.err{background:#3a1b14;color:#ffd9cf}
.msg{max-width:90%;border-radius:14px;padding:9px 11px;font-size:12px;margin:0 0 8px;line-height:1.75}
.msg.me{margin-right:auto;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:5px}
.msg.bot{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.samples{display:flex;gap:5px;overflow-x:auto;padding:2px 0 8px}
.samples button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:999px;
  padding:5px 9px;font:inherit;font-size:10px;white-space:nowrap;cursor:pointer}
.note{font-size:10px;color:var(--muted);line-height:1.9}
.section-title{font-size:11.5px;font-weight:800;color:var(--ink);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.list-btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.list-btns button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);font:inherit;text-align:right;cursor:pointer}
.list-btns .t{font-size:12px;font-weight:700;color:var(--ink)}
.list-btns .s{font-size:9.5px;color:var(--muted)}
.meter{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--brand);border-radius:999px}
.meter i.over{background:var(--neg)}
@media (max-width:360px){
  main{padding:10px}
  .hero .big{font-size:20px}
  .stat .v{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">🌾</div>
      <div style="min-width:0">
        <h1 id="bizname">کشاورزحساب</h1>
        <div class="sub" id="subtitle">دفتر کل آرام · حسابداری عمومی</div>
      </div>
    </div>
    <div class="hdr-actions">
      <span class="pill" id="netpill"><span class="dot"></span>محلی</span>
      <button class="icon-btn" id="themeBtn" aria-label="تغییر تم">🌙</button>
    </div>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" aria-label="ثبت سریع">＋</button>
  <nav id="nav">
    <button data-tab="home" class="on"><span class="i">🏠</span>خانه</button>
    <button data-tab="ledger"><span class="i">📒</span>دفتر</button>
    <button data-tab="reports"><span class="i">📊</span>گزارش</button>
    <button data-tab="assistant"><span class="i">✨</span>دستیار</button>
    <button data-tab="more"><span class="i">⋯</span>بیشتر</button>
  </nav>
</div>
<div class="sheet-wrap hide" id="sheet"><div class="sheet">
  <div class="sheet-head"><h3 id="sheetTitle">ثبت</h3><button class="close" id="sheetClose" aria-label="بستن">×</button></div>
  <div id="sheetBody"></div>
</div></div>
<div class="toast" id="toast"></div>
<script src="./app.js" defer></script>
</body>
</html>

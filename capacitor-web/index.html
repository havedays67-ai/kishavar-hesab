<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e5827">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
<title>کشاورزحساب — آفلاین</title>
<style>
:root{
  --bg:#f7f5ee; --card:#ffffff; --ink:#1d2a21; --muted:#65756a; --line:#e6e0d2;
  --green:#1e5827; --green2:#368a3d; --soft:#eaf4e7; --amber:#9a6b12; --red:#a33a2b;
  --shadow:0 18px 34px -26px rgba(18,48,25,.65);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(800px 380px at 90% -8%,#dcefdb,transparent 62%),var(--bg);
  color:var(--ink);font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:76px}
header{padding:18px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--green2),#123019);display:grid;place-items:center;font-size:22px;color:#f4f0e4;box-shadow:var(--shadow)}
h1{font-size:16px;margin:0;color:#123019}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.pill{font-size:10px;background:var(--soft);color:var(--green);border:1px solid #d5e8d1;border-radius:999px;padding:4px 9px;white-space:nowrap}
main{flex:1;padding:6px 14px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi .l{font-size:10px;color:var(--muted)}
.kpi .v{font-size:16px;font-weight:800;margin-top:4px;direction:rtl}
.kpi.income .v{color:#1f6b33}.kpi.expense .v{color:var(--red)}.kpi.profit .v{color:var(--green)}
.kpi.wide{grid-column:1/-1}
.section-title{font-size:12px;color:var(--muted);margin:14px 2px 6px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.ico{width:34px;height:34px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:10px;color:var(--muted)}
.amt{font-size:12px;font-weight:800;white-space:nowrap}
.amt.in{color:#1f6b33}.amt.out{color:var(--red)}
.empty{text-align:center;color:var(--muted);font-size:11px;padding:22px 8px;line-height:2}
.btn{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#fff;color:var(--green);border:1px solid #cfe3ca}
.btn.danger{background:#fbeae7;color:var(--red);border:1px solid #f0cfc8}
.btn.block{width:100%}
.btn.sm{padding:7px 10px;font-size:11px;border-radius:10px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:800;font-size:13px;box-shadow:0 16px 30px -12px rgba(18,48,25,.7);cursor:pointer;z-index:5}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{background:0;border:0;font:inherit;font-size:10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;cursor:pointer;border-radius:12px}
nav button .i{font-size:18px;line-height:1}
nav button.on{color:var(--green);background:var(--soft)}
label{display:block;font-size:10px;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;border:1px solid #ddd7c7;background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:#58a75c;box-shadow:0 0 0 3px #dcefdb}
textarea{min-height:76px;resize:vertical;line-height:1.9}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#efece2;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font:inherit;font-size:11px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--green);font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.chat{display:flex;flex-direction:column;gap:8px;padding:4px 0 8px;min-height:180px;max-height:46vh;overflow:auto}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:12px;line-height:1.95;white-space:pre-wrap}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-right-radius:4px}
.msg.user{background:var(--green);color:#fff;align-self:flex-end;border-bottom-left-radius:4px}
.draft{border:1px solid #cfe3ca;background:#f4faf2;border-radius:14px;padding:10px;margin:8px 0;font-size:12px;line-height:2}
.draft .actions{display:flex;gap:8px;margin-top:8px}
.draft .actions button{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font:inherit;font-size:10px;color:var(--muted);cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:8px 4px;border-bottom:1px dashed var(--line);text-align:right}
th{color:var(--muted);font-weight:600;font-size:10px}
.toast{position:fixed;bottom:148px;left:50%;transform:translateX(-50%);background:#123019;color:#eaf4e7;padding:9px 14px;border-radius:999px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:20;display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:0;border:0;color:#9fe0a6;font:inherit;font-size:11px;font-weight:800;cursor:pointer}
.hide{display:none!important}
.note{font-size:10px;color:var(--muted);line-height:1.9}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">🌾</div>
      <div><h1>کشاورزحساب</h1><div class="sub" id="subtitle">حسابداری آفلاین مزرعه</div></div>
    </div>
    <span class="pill" id="netpill">آفلاین</span>
  </header>
  <main id="view"></main>
  <button class="fab hide" id="fab">＋ ثبت جدید</button>
  <nav>
    <button data-tab="home" class="on"><span class="i">🏠</span>خانه</button>
    <button data-tab="list"><span class="i">📋</span>تراکنش‌ها</button>
    <button data-tab="assistant"><span class="i">💬</span>دستیار</button>
    <button data-tab="report"><span class="i">📊</span>گزارش</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script src="./app.js" defer></script>
</body>
</html>
